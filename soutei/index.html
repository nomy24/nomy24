<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイサービス送迎表</title>
<style>
  /* ── トークン ─────────────────────────────── */
  :root {
    color-scheme: light;
    --paper: #F5F6F2;
    --card: #FFFFFF;
    --sub: #ECEEE8;
    --ink: #16202A;
    --ink-2: #4A5765;
    --ink-3: #8A96A3;
    --rule: #D9DED6;
    --rule-2: #C3CABE;

    /* 便ごとの色：寒色＝お迎え／暖色＝お送り */
    --ai: #2C4F7C;        /* 藍　　午前 お迎え */
    --ai-soft: #E6EDF5;
    --kaki: #A84B23;      /* 柿渋　午前 お送り */
    --kaki-soft: #F6E8E0;
    --seiheki: #2E6B75;   /* 青碧　午後 お迎え */
    --seiheki-soft: #E1EDEE;
    --enji: #8E3B4E;      /* 臙脂　午後 お送り */
    --enji-soft: #F5E5E9;

    /* 記号は便によらず一定 */
    --tag-wc: #2F5D8C;
    --tag-help: #9C2B2B;
    --tag-door: #8A5A1E;

    --warn: #9C2B2B;
    --warn-soft: #F6E7E5;

    --accent: var(--ai);
    --accent-soft: var(--ai-soft);

    --mincho: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "MS PMincho", serif;
    --gothic: "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic", "Noto Sans JP", "Meiryo", system-ui, sans-serif;

    --step: 4px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --paper: #11161B;
      --card: #191F26;
      --sub: #212932;
      --ink: #E7EAE5;
      --ink-2: #A4AEB8;
      --ink-3: #6C7883;
      --rule: #2B333B;
      --rule-2: #3A444E;
      --ai: #8FB2D8;
      --ai-soft: #1D2937;
      --kaki: #D68C64;
      --kaki-soft: #31241C;
      --seiheki: #79B4BC;
      --seiheki-soft: #17292C;
      --enji: #D2879A;
      --enji-soft: #2E1C22;
      --tag-wc: #8FB2D8;
      --tag-help: #DE8480;
      --tag-door: #D2A86A;
      --warn: #DE8480;
      --warn-soft: #331E1E;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #11161B;
    --card: #191F26;
    --sub: #212932;
    --ink: #E7EAE5;
    --ink-2: #A4AEB8;
    --ink-3: #6C7883;
    --rule: #2B333B;
    --rule-2: #3A444E;
    --ai: #8FB2D8;
    --ai-soft: #1D2937;
    --kaki: #D68C64;
    --kaki-soft: #31241C;
    --seiheki: #79B4BC;
    --seiheki-soft: #17292C;
    --enji: #D2879A;
    --enji-soft: #2E1C22;
    --tag-wc: #8FB2D8;
    --tag-help: #DE8480;
    --tag-door: #D2A86A;
    --warn: #DE8480;
    --warn-soft: #331E1E;
  }

  :root[data-theme="light"] {
    color-scheme: light;
    --paper: #F5F6F2;
    --card: #FFFFFF;
    --sub: #ECEEE8;
    --ink: #16202A;
    --ink-2: #4A5765;
    --ink-3: #8A96A3;
    --rule: #D9DED6;
    --rule-2: #C3CABE;
    --ai: #2C4F7C;
    --ai-soft: #E6EDF5;
    --kaki: #A84B23;
    --kaki-soft: #F6E8E0;
    --seiheki: #2E6B75;
    --seiheki-soft: #E1EDEE;
    --enji: #8E3B4E;
    --enji-soft: #F5E5E9;
    --tag-wc: #2F5D8C;
    --tag-help: #9C2B2B;
    --tag-door: #8A5A1E;
    --warn: #9C2B2B;
    --warn-soft: #F6E7E5;
  }

  /* ── ベース ───────────────────────────────── */
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--gothic);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .sheet {
    max-width: 1260px;
    margin: 0 auto;
    padding: calc(var(--step) * 8) calc(var(--step) * 5) calc(var(--step) * 12);
    display: flex;
    flex-direction: column;
    gap: calc(var(--step) * 6);
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 1px;
  }

  /* ── 表題 ─────────────────────────────────── */
  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: calc(var(--step) * 5);
    padding-bottom: calc(var(--step) * 4);
    border-bottom: 2px solid var(--ink);
  }

  .eyebrow {
    margin: 0;
    font-size: 11px;
    letter-spacing: .18em;
    color: var(--ink-3);
  }

  .masthead h1 {
    margin: 2px 0 0;
    font-family: var(--mincho);
    font-size: 30px;
    font-weight: 600;
    letter-spacing: .1em;
    text-wrap: balance;
  }

  .mast-fields {
    display: flex;
    flex-wrap: wrap;
    gap: calc(var(--step) * 5);
    align-items: flex-end;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .field > span {
    font-size: 10px;
    letter-spacing: .14em;
    color: var(--ink-3);
  }

  .field input {
    font: inherit;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--rule-2);
    padding: 2px 0;
    min-width: 8.5rem;
  }

  .field input:hover { border-bottom-color: var(--accent); }

  .date-print { display: none; }

  /* ── 便の切替 ─────────────────────────────── */
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: calc(var(--step) * 4);
  }

  .legs {
    display: flex;
    flex-wrap: wrap;
    gap: calc(var(--step) * 3);
  }

  .leg-group {
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--sub);
    padding: 3px 3px 3px 10px;
  }

  .group-label {
    font-family: var(--mincho);
    font-size: 13px;
    letter-spacing: .14em;
    color: var(--ink-2);
    margin-right: 6px;
  }

  .legs button {
    font: inherit;
    font-size: 14px;
    padding: 7px 16px;
    border: 0;
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
    letter-spacing: .06em;
  }

  .legs button[aria-selected="true"] {
    background: var(--card);
    color: var(--ink);
    box-shadow: inset 0 -2px 0 var(--tab, var(--ai));
  }

  .tools {
    display: flex;
    gap: calc(var(--step) * 2);
  }

  .tools button {
    font: inherit;
    font-size: 13px;
    padding: 7px 16px;
    background: transparent;
    color: var(--ink-2);
    border: 1px solid var(--rule-2);
    cursor: pointer;
  }

  .tools button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── 便ヘッダ ─────────────────────────────── */
  .leg[hidden] { display: none; }

  .leg-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: calc(var(--step) * 3) calc(var(--step) * 5);
    padding: calc(var(--step) * 3) 0;
    margin-bottom: calc(var(--step) * 4);
    border-bottom: 1px solid var(--rule);
  }

  .leg-title {
    margin: 0;
    font-family: var(--mincho);
    font-size: 20px;
    font-weight: 600;
    letter-spacing: .12em;
    color: var(--accent);
  }

  .leg-title small {
    font-family: var(--gothic);
    font-size: 12px;
    letter-spacing: .1em;
    color: var(--ink-2);
    margin-left: 8px;
  }

  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: calc(var(--step) * 5);
    margin-left: auto;
  }

  .stat {
    display: flex;
    align-items: baseline;
    gap: 5px;
    font-size: 12px;
    color: var(--ink-3);
  }

  .stat b {
    font-size: 19px;
    font-weight: 600;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .stat.is-alert b { color: var(--warn); }
  .stat.is-alert { color: var(--warn); }

  .print-stamp {
    display: none;
    font-size: 11px;
    color: var(--ink-2);
    letter-spacing: .08em;
  }

  /* ── 車両カード ───────────────────────────── */
  .fleet {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: calc(var(--step) * 4);
  }

  @media (max-width: 980px) {
    .fleet { grid-template-columns: minmax(0, 1fr); }
  }

  .car {
    display: grid;
    grid-template-columns: 116px minmax(0, 1fr);
    background: var(--card);
    border: 1px solid var(--rule);
    break-inside: avoid;
  }

  @media (max-width: 460px) {
    .car { grid-template-columns: minmax(0, 1fr); }
  }

  .car-id {
    background: var(--accent-soft);
    border-right: 1px solid var(--rule);
    padding: calc(var(--step) * 3);
    display: flex;
    flex-direction: column;
    gap: calc(var(--step) * 2);
  }

  .car-no {
    display: flex;
    align-items: baseline;
    gap: 3px;
    color: var(--accent);
  }

  .car-no .num {
    font-family: var(--mincho);
    font-size: 34px;
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .car-no .unit {
    font-size: 12px;
    letter-spacing: .08em;
  }

  .car-size {
    display: flex;
    flex-direction: column;
    margin: 0;
    font-size: 11px;
    line-height: 1.4;
    letter-spacing: .06em;
    color: var(--ink-2);
    white-space: nowrap;
  }

  /* 定員ピップ：■＝乗車　□＝空席 */
  .pips {
    display: flex;
    gap: 3px;
    margin-top: auto;
  }

  .pip {
    width: 9px;
    height: 9px;
    border: 1px solid var(--accent);
    background: transparent;
  }

  .pip.on { background: var(--accent); }

  .car.is-over .pip { border-color: var(--warn); }
  .car.is-over .pip.on { background: var(--warn); }

  .car-meta {
    margin: 0;
    font-size: 10px;
    line-height: 1.45;
    color: var(--ink-2);
    word-break: keep-all;
    overflow-wrap: break-word;
  }

  .car-meta .nb { white-space: nowrap; }

  .car-meta .driver {
    display: block;
    font-size: 13px;
    line-height: 1.35;
    color: var(--ink);
    margin-bottom: 1px;
  }

  .car-body { min-width: 0; }

  /* ── ルート順 ─────────────────────────────── */
  .route {
    list-style: none;
    margin: 0;
    padding: 0;
    position: relative;
  }

  /* 経路線：順番の丸を縦につなぐ */
  .route::before {
    content: "";
    position: absolute;
    left: calc(var(--step) * 3 + 9px);
    top: 18px;
    bottom: 18px;
    width: 1px;
    background: var(--rule-2);
  }

  .stop {
    display: grid;
    grid-template-columns: 19px 3.6rem minmax(5rem, 1.25fr) minmax(5rem, 1fr) auto;
    align-items: center;
    gap: calc(var(--step) * 2);
    padding: 5px calc(var(--step) * 3);
    border-bottom: 1px solid var(--rule);
    min-height: 32px;
  }

  .stop.head {
    padding-top: 3px;
    padding-bottom: 3px;
    min-height: 0;
    font-size: 10px;
    letter-spacing: .1em;
    color: var(--ink-3);
    background: var(--sub);
  }

  .stop.head .ord { visibility: hidden; }

  .stop.dup { background: var(--warn-soft); }

  .ord {
    position: relative;
    z-index: 1;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    border: 1px solid var(--rule-2);
    background: var(--card);
    color: var(--ink-2);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    display: grid;
    place-items: center;
  }

  .stop.filled .ord {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--card);
  }

  .stop.dup .ord { border-color: var(--warn); background: var(--warn); }

  .t {
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
  }

  /* 利用者名：マスタからのプルダウン。見た目は帳票の記入欄に寄せる */
  .who {
    font: inherit;
    font-size: 14px;
    width: 100%;
    min-width: 0;
    padding: 0;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-bottom: 1px solid transparent;
    border-radius: 0;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }

  .who:hover { border-bottom-color: var(--accent); }
  .who[data-empty="true"] { border-bottom: 1px dotted var(--rule-2); }
  .stop.dup .who { color: var(--warn); font-weight: 600; }

  .area {
    font-size: 12px;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 当日だけ迎え先を変えた場合の目印 */
  .area.edited { color: var(--accent); }
  .area.edited::after {
    content: "※";
    font-size: 10px;
    margin-left: 2px;
  }

  [contenteditable] {
    min-height: 1.2em;
    outline-offset: 2px;
  }

  [contenteditable]:hover {
    background: var(--accent-soft);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }

  [contenteditable]:empty::before {
    content: attr(data-ph);
    color: var(--ink-3);
    font-size: 12px;
  }

  .tags {
    display: flex;
    gap: 3px;
    justify-content: flex-end;
  }

  .tag {
    width: 17px;
    height: 17px;
    display: grid;
    place-items: center;
    font-size: 10px;
    font-family: inherit;
    border: 1px solid currentColor;
    background: transparent;
    color: var(--rule-2);
    padding: 0;
    cursor: pointer;
    user-select: none;
  }

  .tag[aria-pressed="true"].t-wc { color: var(--tag-wc); }
  .tag[aria-pressed="true"].t-help { color: var(--tag-help); }
  .tag[aria-pressed="true"].t-door { color: var(--tag-door); }

  .car-foot {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: calc(var(--step) * 3);
    padding: 5px calc(var(--step) * 3);
    font-size: 11px;
    color: var(--ink-2);
    background: var(--sub);
  }

  .car-foot .arrive {
    font-size: 13px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .car-foot .count { font-variant-numeric: tabular-nums; }

  .car.is-over .car-foot .count { color: var(--warn); font-weight: 600; }

  /* 未割当の利用者：便ごとに残りを出す */
  .leftover {
    margin: calc(var(--step) * 3) 0 0;
    padding: calc(var(--step) * 2) calc(var(--step) * 3);
    border: 1px solid var(--warn);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 12px;
    line-height: 1.5;
  }

  .leftover[hidden] { display: none; }
  .leftover b { font-weight: 600; }

  .leg-legend { display: none; }

  /* ── 凡例 ─────────────────────────────────── */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: calc(var(--step) * 2) calc(var(--step) * 6);
    padding-top: calc(var(--step) * 3);
    border-top: 1px solid var(--rule);
    font-size: 11px;
    color: var(--ink-2);
  }

  .legend .item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend .swatch {
    width: 15px;
    height: 15px;
    display: grid;
    place-items: center;
    font-size: 9px;
    border: 1px solid currentColor;
  }

  .legend .s-wc { color: var(--tag-wc); }
  .legend .s-help { color: var(--tag-help); }
  .legend .s-door { color: var(--tag-door); }

  /* ── 印刷：A4横・4便で4枚 ─────────────────── */
  @page {
    size: A4 landscape;
    margin: 8mm;
  }

  @media print {
    :root {
      color-scheme: light;
      --paper: #fff;
      --card: #fff;
      --sub: #F2F2F0;
      --ink: #000;
      --ink-2: #333;
      --ink-3: #666;
      --rule: #B8B8B8;
      --rule-2: #CCCCCC;
      --ai: #1F3A5C;
      --ai-soft: #EDF1F6;
      --kaki: #7E3617;
      --kaki-soft: #F7EDE7;
      --seiheki: #1F4F57;
      --seiheki-soft: #E8F1F2;
      --enji: #6B2C3B;
      --enji-soft: #F7EBEE;
      --warn: #8A1F1F;
      --warn-soft: #FAF0EF;
    }

    body { background: #fff; font-size: 9pt; line-height: 1.3; }

    .sheet { max-width: none; padding: 0; gap: 2mm; }

    .controls { display: none; }

    .masthead { padding-bottom: 1.5mm; border-bottom-width: 1.2pt; }
    .eyebrow { font-size: 6.5pt; }
    .masthead h1 { font-size: 13pt; margin-top: 0; }
    .mast-fields { gap: 6mm; }
    .field > span { font-size: 6pt; }
    .field input { font-size: 8.5pt; padding: 0; min-width: 26mm; border-bottom-color: #999; }
    #date { display: none; }

    .date-print {
      display: block;
      font-size: 8.5pt;
      padding-bottom: 1px;
      border-bottom: 1px solid #999;
      min-width: 34mm;
    }

    .leg[hidden] { display: block !important; }
    .leg { break-before: page; }
    .leg:first-of-type { break-before: auto; }

    .print-stamp { display: block; margin-left: auto; font-size: 7pt; }
    .stats { margin-left: 0; gap: 6mm; }
    .stat { font-size: 7pt; }
    .stat b { font-size: 10pt; }

    .leg-head { padding: 1mm 0; margin-bottom: 1.5mm; gap: 1mm 5mm; }
    .leg-title { font-size: 11pt; }
    .leg-title small { font-size: 7.5pt; }

    .fleet { gap: 2mm; }

    .car { grid-template-columns: 21mm minmax(0, 1fr); }
    .car-id { padding: 1.2mm; gap: 0.8mm; }
    .car-no .num { font-size: 15pt; }
    .car-no .unit { font-size: 7pt; }
    .car-size { font-size: 6.5pt; }
    .car-meta { font-size: 6.5pt; line-height: 1.25; }
    .car-meta .driver { font-size: 8pt; margin-bottom: 0; }
    .pip { width: 6px; height: 6px; }

    .route::before { top: 12px; bottom: 12px; left: calc(1.6mm + 6.5px); }

    .stop {
      min-height: 0;
      padding: 0.55mm 1.6mm;
      gap: 1.4mm;
      grid-template-columns: 13px 3.2rem minmax(4.4rem, 1.25fr) minmax(4.4rem, 1fr) auto;
      line-height: 1.25;
    }

    .stop.head { font-size: 6pt; padding-top: 0.3mm; padding-bottom: 0.3mm; }

    .ord { width: 13px; height: 13px; font-size: 6.5pt; }
    .t, .who { font-size: 8.5pt; }
    .area { font-size: 7pt; }
    [contenteditable]:empty::before { content: ""; }

    /* 空欄の行は手書きできるよう罫線を残す */
    .stop.empty .t, .stop.empty .area { border-bottom: 1px dotted #BBB; }
    .who[data-empty="true"] { border-bottom: 1px dotted #BBB; }

    .tag { width: 12px; height: 12px; font-size: 6.5pt; }

    .car-foot { padding: 0.6mm 1.6mm; font-size: 7pt; }
    .car-foot .arrive { font-size: 8.5pt; }

    .leftover { margin-top: 1.5mm; padding: 1mm 1.6mm; font-size: 7pt; }

    .legend { display: none; }

    .leg-legend {
      display: block;
      margin: 1.5mm 0 0;
      padding-top: 1mm;
      border-top: 1px solid var(--rule);
      font-size: 6.5pt;
      letter-spacing: .04em;
      color: var(--ink-2);
    }
  }
</style>

<div class="sheet">
  <header class="masthead">
    <div>
      <p class="eyebrow">通所介護事業所　デイサービス　あさひ</p>
      <h1>送迎運行表</h1>
    </div>
    <div class="mast-fields">
      <label class="field">
        <span>運行日</span>
        <input type="date" id="date" value="2026-07-27">
        <span class="date-print" id="date-print"></span>
      </label>
      <label class="field">
        <span>天候・道路状況</span>
        <input type="text" id="weather" value="晴／通常" size="10">

        { t: "17:24", id: "u45" }
      ] },
      5: { arrive: "17:39", stops: [
        { t: "16:43", id: "u51" },
        { t: "16:57", id: "u50" },
        { t: "17:11", id: "u49" },
        { t: "17:25", id: "u48" }
      ] },
      6: { arrive: "17:37", stops: [
        { t: "16:47", id: "u54" },
        { t: "17:04", id: "u53" },
        { t: "17:21", id: "u52" }
      ] },
      7: { arrive: "17:41", stops: [
        { t: "16:35", id: "u59" },
        { t: "16:49", id: "u58" },
        { t: "17:03", id: "u57" },
        { t: "17:17", id: "u56" },
        { t: "17:31", id: "u55" }
      ] },
      8: { arrive: "17:23", stops: [
        { t: "16:39", id: "u62" },
        { t: "16:54", id: "u61" },
        { t: "17:09", id: "u60" }
      ] }
    } }
  };


  const USER_BY_ID = new Map(USERS.map((u) => [u.id, u]));

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  /* 利用者マスタを町名でまとめたプルダウン */
  function buildUserSelect() {
    const sel = el("select", "who");
    sel.append(new Option("", ""));

    const towns = [];
    USERS.forEach((u) => { if (!towns.includes(u.town)) towns.push(u.town); });

    towns.forEach((town) => {
      const group = document.createElement("optgroup");
      group.label = town;
      USERS.filter((u) => u.town === town).forEach((u) => {
        const opt = new Option(u.name, u.id);
        opt.title = u.addr;
        group.append(opt);
      });
      sel.append(group);
    });

    return sel;
  }

  /* 選択された利用者の住所と記号を行に流し込む */
  function applyUser(stop, userId) {
    const user = USER_BY_ID.get(userId);
    const area = stop.querySelector(".area");
    const sel = stop.querySelector(".who");

    sel.dataset.empty = userId ? "false" : "true";
    sel.title = user ? user.kana : "";
    area.textContent = user ? user.addr : "";
    area.classList.remove("edited");
    area.dataset.master = user ? user.addr : "";

    stop.querySelectorAll(".tag").forEach((tag) => {
      const on = !!user && user.tags.includes(tag.textContent);
      tag.setAttribute("aria-pressed", String(on));
    });
  }

  function buildStop(index, entry) {
    const li = el("li", "stop");
    li.append(el("span", "ord", String(index)));

    const t = el("time", "t", entry ? entry.t : "");
    t.contentEditable = "true";
    t.dataset.ph = "--:--";
    li.append(t);

    const sel = buildUserSelect();
    li.append(sel);

    const area = el("span", "area");
    area.contentEditable = "true";
    area.dataset.ph = "住所（自動）";
    li.append(area);

    const tags = el("span", "tags");
    TAGS.forEach(({ key, cls, title }) => {
      const b = el("button", "tag " + cls, key);
      b.type = "button";
      b.title = title;
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", () => {
        b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
      });
      tags.append(b);
    });
    li.append(tags);

    sel.value = entry ? entry.id : "";
    applyUser(li, sel.value);

    sel.addEventListener("change", () => { applyUser(li, sel.value); recount(); });
    area.addEventListener("input", () => {
      area.classList.toggle("edited", area.textContent.trim() !== (area.dataset.master || ""));
    });

    return li;
  }

  function buildCar(leg, car, run) {
    const capacity = car.seats - 1;
    const article = el("article", "car");
    article.dataset.capacity = capacity;

    const id = el("div", "car-id");
    const no = el("div", "car-no");
    no.append(el("span", "num", String(car.no)), el("span", "unit", "号車"));

    const size = el("p", "car-size");
    size.append(el("span", null, car.seats + "人乗り"), el("span", null, "定員 " + capacity + "名"));

    const meta = el("p", "car-meta");
    const cut = car.plate.lastIndexOf(" ");
    meta.append(
      el("span", "driver", car.driver),
      document.createTextNode(car.plate.slice(0, cut + 1)),
      el("span", "nb", car.plate.slice(cut + 1))
    );

    const pips = el("div", "pips");
    for (let i = 0; i < capacity; i++) pips.append(el("span", "pip"));

    id.append(no, size, meta, pips);

    const list = el("ol", "route");
    const head = el("li", "stop head");
    head.append(
      el("span", "ord", ""), el("span", null, "時刻"), el("span", null, "利用者名"),
      el("span", null, "住所"), el("span", null, "記号")
    );
    list.append(head);

    const stops = run ? run.stops : [];
    const rows = Math.max(capacity, stops.length);
    for (let i = 0; i < rows; i++) list.append(buildStop(i + 1, stops[i]));

    const foot = el("div", "car-foot");
    const arrive = el("span", "arrive");
    const at = el("b", null, run ? run.arrive : "--:--");
    at.contentEditable = "true";
    arrive.append(document.createTextNode(leg.arriveLabel + " "), at);
    foot.append(arrive, el("span", "count", ""));

    const body = el("div", "car-body");
    body.append(list, foot);
    article.append(id, body);
    return article;
  }

  function buildLeg(leg) {
    const section = el("section", "leg");
    section.id = "leg-" + leg.key;
    section.dataset.leg = leg.key;
    section.dataset.part = leg.part;
    section.setAttribute("role", "tabpanel");
    section.setAttribute("aria-labelledby", "tab-" + leg.key);
    section.style.setProperty("--accent", "var(--" + leg.accent + ")");
    section.style.setProperty("--accent-soft", "var(--" + leg.accent + "-soft)");

    const head = el("div", "leg-head");
    const title = el("p", "leg-title", leg.partLabel + "　" + leg.dir);
    title.append(el("small", null, leg.flow));

    const stats = el("div", "stats");
    stats.innerHTML =
      '<span class="stat"><b data-stat="cars">' + FLEET.length + '</b>台 稼働</span>' +
      '<span class="stat"><b data-stat="riders">0</b>名 乗車</span>' +
      '<span class="stat"><b data-stat="free">0</b>席 空き</span>' +
      '<span class="stat"><b data-stat="left">0</b>名 未割当</span>' +
      '<span class="stat"><b data-stat="dup">0</b>件 重複</span>';

    head.append(title, stats, el("span", "print-stamp", ""));

    const fleet = el("div", "fleet");
    FLEET.forEach((car) => fleet.append(buildCar(leg, car, PLAN[leg.key].runs[car.no])));

    const leftover = el("p", "leftover");
    leftover.hidden = true;

    const legend = el("p", "leg-legend",
      "記号　車＝車椅子／介＝乗降介助／玄＝玄関先まで　　■＝乗車　□＝空席（定員は運転手を除く人数）　　"
      + "※印＝住所を当日変更した行　　変更は運行管理者へ連絡のうえ余白に記入してください。");

    section.append(head, fleet, leftover, legend);
    return section;
  }

  /* 乗車人数・空席・定員超過・重複・未割当を数え直す */
  function recount() {
    LEGS.forEach((leg) => {
      const section = document.getElementById("leg-" + leg.key);
      const seen = new Map();
      let riders = 0;
      let free = 0;

      section.querySelectorAll(".car").forEach((car) => {
        const capacity = Number(car.dataset.capacity);
        let n = 0;

        car.querySelectorAll(".stop:not(.head)").forEach((stop) => {
          const id = stop.querySelector(".who").value;
          stop.classList.toggle("filled", !!id);
          stop.classList.toggle("empty", !id);
          if (id) {
            n++;
            if (!seen.has(id)) seen.set(id, []);
            seen.get(id).push(stop);
          }
        });

        const over = n > capacity;
        car.classList.toggle("is-over", over);
        car.querySelectorAll(".pip").forEach((pip, i) => pip.classList.toggle("on", i < n));
        car.querySelector(".count").textContent =
          "乗車 " + n + " / " + capacity + " 名" + (over ? "　⚠ 定員超過" : "");

        riders += n;
        free += Math.max(0, capacity - n);
      });

      let dup = 0;
      seen.forEach((stops) => {
        const isDup = stops.length > 1;
        if (isDup) dup++;
        stops.forEach((stop) => stop.classList.toggle("dup", isDup));
      });

      const missing = ROSTER[leg.part].filter((id) => !seen.has(id)).map((id) => USER_BY_ID.get(id).name);

      const set = (name, value, alert) => {
        const b = section.querySelector('[data-stat="' + name + '"]');
        b.textContent = value;
        b.closest(".stat").classList.toggle("is-alert", !!alert);
      };
      set("riders", riders, false);
      set("free", free, false);
      set("left", missing.length, missing.length > 0);
      set("dup", dup, dup > 0);

      const leftover = section.querySelector(".leftover");
      leftover.hidden = missing.length === 0;
      leftover.innerHTML = "";
      leftover.append(
        el("b", null, "未割当 " + missing.length + "名　"),
        document.createTextNode(missing.join("　／　"))
      );
    });
  }

  function switchLeg(key) {
    LEGS.forEach((leg) => {
      const on = leg.key === key;
      document.getElementById("leg-" + leg.key).hidden = !on;
      document.getElementById("tab-" + leg.key).setAttribute("aria-selected", String(on));
      if (on) {
        document.documentElement.style.setProperty("--accent", "var(--" + leg.accent + ")");
        document.documentElement.style.setProperty("--accent-soft", "var(--" + leg.accent + "-soft)");
      }
    });
  }

  function fmtDate(v) {
    if (!v) return "";
    const d = new Date(v + "T00:00:00");
    const w = "日月火水木金土"[d.getDay()];
    return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日（" + w + "）";
  }

  function refreshStamps() {
    const date = fmtDate(document.getElementById("date").value);
    document.getElementById("date-print").textContent = date;
    LEGS.forEach((leg) => {
      document.querySelector("#leg-" + leg.key + " .print-stamp").textContent =
        "デイサービス あさひ／" + leg.partLabel + " " + leg.dir + "／運行日 " + date;
    });
  }

  /* ── 組み立て ─────────────────────────────── */
  const tablist = document.querySelector(".legs");
  const sections = document.getElementById("sections");

  ["am", "pm"].forEach((part) => {
    const group = el("span", "leg-group");
    group.append(el("span", "group-label", part === "am" ? "午前" : "午後"));
    LEGS.filter((leg) => leg.part === part).forEach((leg) => {
      const tab = el("button", null, leg.dir);
      tab.type = "button";
      tab.id = "tab-" + leg.key;
      tab.setAttribute("role", "tab");
      tab.setAttribute("aria-controls", "leg-" + leg.key);
      tab.setAttribute("aria-selected", "false");
      tab.style.setProperty("--tab", "var(--" + leg.accent + ")");
      tab.addEventListener("click", () => switchLeg(leg.key));
      group.append(tab);
    });
    tablist.append(group);
  });

  LEGS.forEach((leg) => sections.append(buildLeg(leg)));

  switchLeg(LEGS[0].key);
  recount();
  refreshStamps();

  document.getElementById("date").addEventListener("change", refreshStamps);
  document.getElementById("btn-print").addEventListener("click", () => window.print());
  document.getElementById("btn-clear").addEventListener("click", () => {
    if (!window.confirm("全4便の時刻・利用者・住所・記号を消去します。よろしいですか？")) return;
    document.querySelectorAll(".stop:not(.head)").forEach((stop) => {
      stop.querySelector(".t").textContent = "";
      stop.querySelector(".who").value = "";
      applyUser(stop, "");
    });
    recount();
  });

  document.addEventListener("input", recount);
  document.addEventListener("click", (e) => { if (e.target.closest(".tag")) recount(); });

  /* 貼り付けは書式を落として素のテキストに */
  document.addEventListener("paste", (e) => {
    if (!e.target.closest("[contenteditable]")) return;
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData("text").replace(/\s+/g, " ").trim();
    document.execCommand("insertText", false, text);
  });
</script>
