<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイサービス送迎表</title>
<style>
  /* ── トークン ─────────────────────────────── */
  :root {
    color-scheme: light;
    --paper: #F5F6F2;
    --card: #FFFFFF;
    --sub: #ECEEE8;
    --ink: #16202A;
    --ink-2: #4A5765;
    --ink-3: #8A96A3;
    --rule: #D9DED6;
    --rule-2: #C3CABE;

    /* 便ごとの色：寒色＝お迎え／暖色＝お送り */
    --ai: #2C4F7C;        /* 藍　　午前 お迎え */
    --ai-soft: #E6EDF5;
    --kaki: #A84B23;      /* 柿渋　午前 お送り */
    --kaki-soft: #F6E8E0;
    --seiheki: #2E6B75;   /* 青碧　午後 お迎え */
    --seiheki-soft: #E1EDEE;
    --enji: #8E3B4E;      /* 臙脂　午後 お送り */
    --enji-soft: #F5E5E9;

    /* 記号は便によらず一定 */
    --tag-wc: #2F5D8C;
    --tag-aid: #8A5A1E;
    --tag-door: #3F6B4E;

    --warn: #9C2B2B;
    --warn-soft: #F6E7E5;

    --accent: var(--ai);
    --accent-soft: var(--ai-soft);

    --mincho: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "MS PMincho", serif;
    --gothic: "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic", "Noto Sans JP", "Meiryo", system-ui, sans-serif;

    --step: 4px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --paper: #11161B;
      --card: #191F26;
      --sub: #212932;
      --ink: #E7EAE5;
      --ink-2: #A4AEB8;
      --ink-3: #6C7883;
      --rule: #2B333B;
      --rule-2: #3A444E;
      --ai: #8FB2D8;
      --ai-soft: #1D2937;
      --kaki: #D68C64;
      --kaki-soft: #31241C;
      --seiheki: #79B4BC;
      --seiheki-soft: #17292C;
      --enji: #D2879A;
      --enji-soft: #2E1C22;
      --tag-wc: #8FB2D8;
      --tag-aid: #D2A86A;
      --tag-door: #86B79A;
      --warn: #DE8480;
      --warn-soft: #331E1E;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #11161B;
    --card: #191F26;
    --sub: #212932;
    --ink: #E7EAE5;
    --ink-2: #A4AEB8;
    --ink-3: #6C7883;
    --rule: #2B333B;
    --rule-2: #3A444E;
    --ai: #8FB2D8;
    --ai-soft: #1D2937;
    --kaki: #D68C64;
    --kaki-soft: #31241C;
    --seiheki: #79B4BC;
    --seiheki-soft: #17292C;
    --enji: #D2879A;
    --enji-soft: #2E1C22;
    --tag-wc: #8FB2D8;
    --tag-aid: #D2A86A;
    --tag-door: #86B79A;
    --warn: #DE8480;
    --warn-soft: #331E1E;
  }

  :root[data-theme="light"] {
    color-scheme: light;
    --paper: #F5F6F2;
    --card: #FFFFFF;
    --sub: #ECEEE8;
    --ink: #16202A;
    --ink-2: #4A5765;
    --ink-3: #8A96A3;
    --rule: #D9DED6;
    --rule-2: #C3CABE;
    --ai: #2C4F7C;
    --ai-soft: #E6EDF5;
    --kaki: #A84B23;
    --kaki-soft: #F6E8E0;
    --seiheki: #2E6B75;
    --seiheki-soft: #E1EDEE;
    --enji: #8E3B4E;
    --enji-soft: #F5E5E9;
    --tag-wc: #2F5D8C;
    --tag-aid: #8A5A1E;
    --tag-door: #3F6B4E;
    --warn: #9C2B2B;
    --warn-soft: #F6E7E5;
  }

  /* ── ベース ───────────────────────────────── */
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--gothic);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .sheet {
    max-width: 1260px;
    margin: 0 auto;
    padding: calc(var(--step) * 8) calc(var(--step) * 5) calc(var(--step) * 12);
    display: flex;
    flex-direction: column;
    gap: calc(var(--step) * 6);
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 1px;
  }

  /* ── 表題（日付と一体） ────────────────────── */
  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: calc(var(--step) * 2) calc(var(--step) * 5);
    padding-bottom: calc(var(--step) * 4);
    border-bottom: 2px solid var(--ink);
  }

  .eyebrow {
    margin: 0;
    font-size: 11px;
    letter-spacing: .18em;
    color: var(--ink-3);
  }

  .masthead h1 {
    margin: 0;
    font-family: var(--mincho);
    font-size: 30px;
    font-weight: 600;
    letter-spacing: .08em;
    line-height: 1.25;
    text-wrap: balance;
  }

  /* 日付そのものが入力欄。クリックでカレンダーが開く */
  .date-slot {
    position: relative;
    display: inline-block;
    border-bottom: 1px dashed var(--rule-2);
  }

  .date-slot:hover { border-bottom-color: var(--accent); }

  .date-slot input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    opacity: 0;
    cursor: pointer;
  }

  .date-slot:focus-within { border-bottom-color: var(--accent); }

  /* ── 便の切替 ─────────────────────────────── */
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: calc(var(--step) * 4);
  }

  .legs {
    display: flex;
    flex-wrap: wrap;
    gap: calc(var(--step) * 3);
  }

  .leg-group {
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--sub);
    padding: 3px 3px 3px 10px;
  }

  .group-label {
    font-family: var(--mincho);
    font-size: 13px;
    letter-spacing: .14em;
    color: var(--ink-2);
    margin-right: 6px;
  }

  .legs button {
    font: inherit;
    font-size: 14px;
    padding: 7px 16px;
    border: 0;
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
    letter-spacing: .06em;
  }

  .legs button[aria-selected="true"] {
    background: var(--card);
    color: var(--ink);
    box-shadow: inset 0 -2px 0 var(--tab, var(--ai));
  }

  .tools {
    display: flex;
    gap: calc(var(--step) * 2);
  }

  .tools button {
    font: inherit;
    font-size: 13px;
    padding: 7px 16px;
    background: transparent;
    color: var(--ink-2);
    border: 1px solid var(--rule-2);
    cursor: pointer;
  }

  .tools button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── 便ヘッダ ─────────────────────────────── */
  .leg[hidden] { display: none; }

  .leg-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: calc(var(--step) * 3) calc(var(--step) * 5);
    padding: calc(var(--step) * 3) 0;
    margin-bottom: calc(var(--step) * 4);
    border-bottom: 1px solid var(--rule);
  }

  .leg-title {
    margin: 0;
    font-family: var(--mincho);
    font-size: 20px;
    font-weight: 600;
    letter-spacing: .12em;
    color: var(--accent);
  }

  .leg-title small {
    font-family: var(--gothic);
    font-size: 12px;
    letter-spacing: .1em;
    color: var(--ink-2);
    margin-left: 8px;
  }

  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: calc(var(--step) * 5);
    margin-left: auto;
  }

  .stat {
    display: flex;
    align-items: baseline;
    gap: 5px;
    font-size: 12px;
    color: var(--ink-3);
  }

  .stat b {
    font-size: 19px;
    font-weight: 600;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .stat.is-alert, .stat.is-alert b { color: var(--warn); }

  .print-stamp {
    display: none;
    font-size: 11px;
    color: var(--ink-2);
    letter-spacing: .08em;
  }

  /* ── 車両カード ───────────────────────────── */
  .fleet {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: calc(var(--step) * 4);
  }

  @media (max-width: 980px) {
    .fleet { grid-template-columns: minmax(0, 1fr); }
  }

  .car {
    display: grid;
    grid-template-columns: 116px minmax(0, 1fr);
    background: var(--card);
    border: 1px solid var(--rule);
    break-inside: avoid;
  }

  @media (max-width: 460px) {
    .car { grid-template-columns: minmax(0, 1fr); }
  }

  .car-id {
    background: var(--accent-soft);
    border-right: 1px solid var(--rule);
    padding: calc(var(--step) * 3);
    display: flex;
    flex-direction: column;
    gap: calc(var(--step) * 2);
  }

  /* 号車は当日書き入れる。枠だけ用意する */
  .car-no {
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--accent);
  }

  .no-box {
    width: 32px;
    height: 32px;
    border: 1px solid var(--accent);
    background: var(--card);
    font-family: var(--mincho);
    font-size: 22px;
    font-weight: 600;
    line-height: 1;
    color: var(--accent);
    display: grid;
    place-items: center;
    font-variant-numeric: tabular-nums;
  }

  .car-no .unit {
    font-size: 12px;
    letter-spacing: .08em;
  }

  .car-size {
    display: flex;
    flex-direction: column;
    margin: 0;
    font-size: 11px;
    line-height: 1.4;
    letter-spacing: .06em;
    color: var(--ink-2);
    white-space: nowrap;
  }

  /* 定員ピップ：■＝乗車　□＝空席 */
  .pips {
    display: flex;
    gap: 3px;
    margin-top: auto;
  }

  .pip {
    width: 9px;
    height: 9px;
    border: 1px solid var(--accent);
    background: transparent;
  }

  .pip.on { background: var(--accent); }

  .car.is-over .pip { border-color: var(--warn); }
  .car.is-over .pip.on { background: var(--warn); }

  .car-meta {
    margin: 0;
    font-size: 10px;
    line-height: 1.45;
    color: var(--ink-2);
    word-break: keep-all;
    overflow-wrap: break-word;
  }

  .car-meta .nb { white-space: nowrap; }

  .car-meta .driver {
    display: block;
    font-size: 13px;
    line-height: 1.35;
    color: var(--ink);
    margin-bottom: 1px;
  }

  .car-body { min-width: 0; }

  /* ── ルート順 ─────────────────────────────── */
  .route {
    list-style: none;
    margin: 0;
    padding: 0;
    position: relative;
  }

  /* 経路線：順番の丸を縦につなぐ */
  .route::before {
    content: "";
    position: absolute;
    left: calc(var(--step) * 3 + 9px);
    top: 18px;
    bottom: 18px;
    width: 1px;
    background: var(--rule-2);
  }

  .stop {
    display: grid;
    grid-template-columns: 19px 3.6rem minmax(5rem, 1.25fr) minmax(5rem, 1fr) auto;
    align-items: center;
    gap: calc(var(--step) * 2);
    padding: 5px calc(var(--step) * 3);
    border-bottom: 1px solid var(--rule);
    min-height: 32px;
  }

  .stop.head {
    padding-top: 3px;
    padding-bottom: 3px;
    min-height: 0;
    font-size: 10px;
    letter-spacing: .1em;
    color: var(--ink-3);
    background: var(--sub);
  }

  .stop.head .ord { visibility: hidden; }

  .stop.dup { background: var(--warn-soft); }

  .ord {
    position: relative;
    z-index: 1;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    border: 1px solid var(--rule-2);
    background: var(--card);
    color: var(--ink-2);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    display: grid;
    place-items: center;
  }

  .stop.filled .ord {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--card);
  }

  .stop.dup .ord { border-color: var(--warn); background: var(--warn); }

  .t {
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
  }

  /* 利用者名：マスタからのプルダウン。見た目は帳票の記入欄に寄せる */
  .who {
    font: inherit;
    font-size: 14px;
    width: 100%;
    min-width: 0;
    padding: 0;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-bottom: 1px solid transparent;
    border-radius: 0;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }

  .who:hover { border-bottom-color: var(--accent); }
  .who[data-empty="true"] { border-bottom: 1px dotted var(--rule-2); }
  .stop.dup .who { color: var(--warn); font-weight: 600; }

  .area {
    font-size: 12px;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 自動で入った値を手で書き換えた欄の目印 */
  .edited { color: var(--accent); }
  .edited::after {
    content: "※";
    font-size: 10px;
    margin-left: 2px;
  }

  [contenteditable] {
    min-height: 1.2em;
    outline-offset: 2px;
  }

  [contenteditable]:hover {
    background: var(--accent-soft);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }

  [contenteditable]:empty::before {
    content: attr(data-ph);
    color: var(--ink-3);
    font-size: 12px;
  }

  .tags {
    display: flex;
    gap: 3px;
    justify-content: flex-end;
  }

  .tag {
    width: 17px;
    height: 17px;
    display: grid;
    place-items: center;
    font-size: 10px;
    font-family: inherit;
    border: 1px solid currentColor;
    background: transparent;
    color: var(--rule-2);
    padding: 0;
    cursor: pointer;
    user-select: none;
  }

  .tag[aria-pressed="true"].t-wc { color: var(--tag-wc); }
  .tag[aria-pressed="true"].t-aid { color: var(--tag-aid); }
  .tag[aria-pressed="true"].t-door { color: var(--tag-door); }

  .car-foot {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: calc(var(--step) * 3);
    padding: 5px calc(var(--step) * 3);
    font-size: 11px;
    color: var(--ink-2);
    background: var(--sub);
  }

  .car-foot .arrive {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 11px;
  }

  /* 着・帰着は空欄。当日手書きで入れる */
  .arrive-box {
    display: inline-block;
    min-width: 4.6rem;
    padding: 0 3px;
    border-bottom: 1px solid var(--rule-2);
    font-size: 13px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    text-align: center;
  }

  .car-foot .count { font-variant-numeric: tabular-nums; }

  .car.is-over .car-foot .count { color: var(--warn); font-weight: 600; }

  /* 未割当の利用者：便ごとに残りを出す */
  .leftover {
    margin: calc(var(--step) * 3) 0 0;
    padding: calc(var(--step) * 2) calc(var(--step) * 3);
    border: 1px solid var(--warn);
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 12px;
    line-height: 1.5;
  }

  .leftover[hidden] { display: none; }
  .leftover b { font-weight: 600; }

  .leg-legend { display: none; }

  /* ── 凡例 ─────────────────────────────────── */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: calc(var(--step) * 2) calc(var(--step) * 6);
    padding-top: calc(var(--step) * 3);
    border-top: 1px solid var(--rule);
    font-size: 11px;
    color: var(--ink-2);
  }

  .legend .item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend .swatch {
    width: 15px;
    height: 15px;
    display: grid;
    place-items: center;
    font-size: 9px;
    border: 1px solid currentColor;
  }

  .legend .s-wc { color: var(--tag-wc); }
  .legend .s-aid { color: var(--tag-aid); }
  .legend .s-door { color: var(--tag-door); }

  /* ── 印刷：A4横・4便で4枚 ─────────────────── */
  @page {
    size: A4 landscape;
    margin: 8mm;
  }

  @media print {
    :root {
      color-scheme: light;
      --paper: #fff;
      --card: #fff;
      --sub: #F2F2F0;
      --ink: #000;
      --ink-2: #333;
      --ink-3: #666;
      --rule: #B8B8B8;
      --rule-2: #CCCCCC;
      --ai: #1F3A5C;
      --ai-soft: #EDF1F6;
      --kaki: #7E3617;
      --kaki-soft: #F7EDE7;
      --seiheki: #1F4F57;
      --seiheki-soft: #E8F1F2;
      --enji: #6B2C3B;
      --enji-soft: #F7EBEE;
      --warn: #8A1F1F;
      --warn-soft: #FAF0EF;
    }

    body { background: #fff; font-size: 9pt; line-height: 1.3; }

    .sheet { max-width: none; padding: 0; gap: 2mm; }

    .controls { display: none; }

    .masthead { padding-bottom: 1.5mm; border-bottom-width: 1.2pt; gap: 1mm 5mm; }
    .eyebrow { font-size: 6.5pt; }
    .masthead h1 { font-size: 14pt; }
    .date-slot { border-bottom: 0; }
    .date-slot input { display: none; }

    .leg[hidden] { display: block !important; }
    .leg { break-before: page; }
    .leg:first-of-type { break-before: auto; }

    .print-stamp { display: block; margin-left: auto; font-size: 7pt; }
    .stats { margin-left: 0; gap: 6mm; }
    .stat { font-size: 7pt; }
    .stat b { font-size: 10pt; }

    .leg-head { padding: 1mm 0; margin-bottom: 1.5mm; gap: 1mm 5mm; }
    .leg-title { font-size: 11pt; }
    .leg-title small { font-size: 7.5pt; }

    .fleet { gap: 2mm; }

    .car { grid-template-columns: 21mm minmax(0, 1fr); }
    .car-id { padding: 1.2mm; gap: 0.8mm; }
    .no-box { width: 9mm; height: 9mm; font-size: 12pt; }
    .car-no .unit { font-size: 7pt; }
    .car-size { font-size: 6.5pt; }
    .car-meta { font-size: 6.5pt; line-height: 1.25; }
    .car-meta .driver { font-size: 8pt; margin-bottom: 0; }
    .pip { width: 6px; height: 6px; }

    .route::before { top: 12px; bottom: 12px; left: calc(1.6mm + 6.5px); }

    .stop {
      min-height: 0;
      padding: 0.55mm 1.6mm;
      gap: 1.4mm;
      grid-template-columns: 13px 3.2rem minmax(4.4rem, 1.25fr) minmax(4.4rem, 1fr) auto;
      line-height: 1.25;
    }

    .stop.head { font-size: 6pt; padding-top: 0.3mm; padding-bottom: 0.3mm; }

    .ord { width: 13px; height: 13px; font-size: 6.5pt; }
    .t, .who { font-size: 8.5pt; }
    .area { font-size: 7pt; }
    [contenteditable]:empty::before { content: ""; }

    /* 空欄は手書きできるよう罫線を残す */
    .stop.empty .t, .stop.empty .area { border-bottom: 1px dotted #BBB; }
    .who[data-empty="true"] { border-bottom: 1px dotted #BBB; }

    .tag { width: 12px; height: 12px; font-size: 6.5pt; }

    .car-foot { padding: 0.6mm 1.6mm; font-size: 7pt; }
    .car-foot .arrive { font-size: 7pt; }
    .arrive-box { min-width: 16mm; font-size: 8.5pt; border-bottom-color: #999; }

    .leftover { margin-top: 1.5mm; padding: 1mm 1.6mm; font-size: 7pt; }

    .legend { display: none; }

    .leg-legend {
      display: block;
      margin: 1.5mm 0 0;
      padding-top: 1mm;
      border-top: 1px solid var(--rule);
      font-size: 6.5pt;
      letter-spacing: .04em;
      color: var(--ink-2);
    }
  }
</style>

<div class="sheet">
  <header class="masthead">
    <p class="eyebrow">通所介護事業所　デイサービス　あさひ</p>
    <h1>
      <span class="date-slot">
        <span id="title-date"></span>
        <input type="date" id="date" value="2026-07-27" aria-label="運行日">
      </span>送迎表
    </h1>

  function parseHHMM(text) {
    const m = String(text).match(/(\d{1,2})\s*[:：]\s*(\d{1,2})/);
    if (!m) return null;
    const h = Number(m[1]), mi = Number(m[2]);
    return h > 23 || mi > 59 ? null : h * 60 + mi;
  }

  /* ── 和暦 ─────────────────────────────────── */
  function wareki(d) {
    const y = d.getFullYear(), md = (d.getMonth() + 1) * 100 + d.getDate();
    const era = (name, first) => name + (y - first === 0 ? "元" : y - first + 1) + "年";
    if (y > 2019 || (y === 2019 && md >= 501)) return era("令和", 2019);
    if (y > 1989 || (y === 1989 && md >= 108)) return era("平成", 1989);
    return era("昭和", 1926);
  }

  function titleDate(v) {
    if (!v) return "";
    const d = new Date(v + "T00:00:00");
    const w = "日月火水木金土"[d.getDay()];
    return wareki(d) + (d.getMonth() + 1) + "月" + d.getDate() + "日（" + w + "曜日）";
  }

    const sel = el("select", "who");

    const towns = [];
    USERS.forEach((u) => { if (!towns.includes(u.town)) towns.push(u.town); });

      group.label = town;
      USERS.filter((u) => u.town === town).forEach((u) => {
        const opt = new Option(u.name, u.id);
        opt.title = u.addr;
        group.append(opt);
      });
      sel.append(group);
    });

    return sel;
  }

    const sel = stop.querySelector(".who");

    sel.dataset.empty = userId ? "false" : "true";
    sel.title = user ? user.kana : "";

    area.textContent = user ? user.addr : "";
    area.dataset.master = user ? user.addr : "";
    area.classList.remove("edited");

    /* 住所が変わったので時刻は自動に戻す */
    t.dataset.manual = "false";
    t.classList.remove("edited");
    if (!user) t.textContent = "";

    stop.querySelectorAll(".tag").forEach((tag) => {
      const on = !!user && user.tags.includes(tag.textContent);
      tag.setAttribute("aria-pressed", String(on));
    });
  }

        b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
      });
      tags.append(b);
    });
    li.append(tags);

    sel.value = userId || "";
    applyUser(li, sel.value);

    sel.addEventListener("change", () => { applyUser(li, sel.value); refresh(); });

    area.addEventListener("input", () => {
      area.classList.toggle("edited", area.textContent.trim() !== (area.dataset.master || ""));
    });

    /* 時刻は手入力で上書きできる。空欄にすると自動計算に戻る */
    t.addEventListener("input", () => {
      const manual = t.textContent.trim() !== "";
      t.dataset.manual = String(manual);
      t.classList.toggle("edited", manual);
    });

    return li;
  }

  function buildCar(leg, car, ids) {
    const capacity = car.seats - 1;
    const article = el("article", "car");
    article.dataset.capacity = capacity;

    const id = el("div", "car-id");

    const no = el("div", "car-no");
    const box = el("span", "no-box");
    box.contentEditable = "true";
    box.title = "号車を記入";
    no.append(box, el("span", "unit", "号車"));

    const size = el("p", "car-size");
    size.append(el("span", null, car.seats + "人乗り"), el("span", null, "定員 " + capacity + "名"));

    const meta = el("p", "car-meta");
    const cut = car.plate.lastIndexOf(" ");
    meta.append(
      el("span", "driver", car.driver),
      document.createTextNode(car.plate.slice(0, cut + 1)),
      el("span", "nb", car.plate.slice(cut + 1))
    );

    const pips = el("div", "pips");
    for (let i = 0; i < capacity; i++) pips.append(el("span", "pip"));

    id.append(no, size, meta, pips);

    const list = el("ol", "route");
    const head = el("li", "stop head");
    head.append(
      el("span", "ord", ""), el("span", null, "時刻"), el("span", null, "利用者名"),
      el("span", null, "住所"), el("span", null, "記号")
    );
    list.append(head);

    const rows = Math.max(capacity, ids.length);
    for (let i = 0; i < rows; i++) list.append(buildStop(i + 1, ids[i]));

    const foot = el("div", "car-foot");
    const arrive = el("span", "arrive");
    const box2 = el("span", "arrive-box");
    box2.contentEditable = "true";
    arrive.append(document.createTextNode(leg.arriveLabel), box2);
    foot.append(arrive, el("span", "count", ""));

    const body = el("div", "car-body");
    body.append(list, foot);
    article.append(id, body);
    return article;
  }

  function buildLeg(leg) {
    const section = el("section", "leg");
    section.id = "leg-" + leg.key;
    section.dataset.leg = leg.key;
    section.dataset.part = leg.part;
    section.setAttribute("role", "tabpanel");
    section.setAttribute("aria-labelledby", "tab-" + leg.key);
    section.style.setProperty("--accent", "var(--" + leg.accent + ")");
    section.style.setProperty("--accent-soft", "var(--" + leg.accent + "-soft)");

    const head = el("div", "leg-head");
    const title = el("p", "leg-title", leg.partLabel + "　" + leg.dir);
    title.append(el("small", null, leg.flow + "　事業所 " + leg.depart + " 出発"));

    const stats = el("div", "stats");
    stats.innerHTML =
      '<span class="stat"><b data-stat="cars">' + FLEET.length + '</b>台 稼働</span>' +
      '<span class="stat"><b data-stat="riders">0</b>名 乗車</span>' +
      '<span class="stat"><b data-stat="free">0</b>席 空き</span>' +
      '<span class="stat"><b data-stat="left">0</b>名 未割当</span>' +
      '<span class="stat"><b data-stat="dup">0</b>件 重複</span>';

    head.append(title, stats, el("span", "print-stamp", ""));

    const fleet = el("div", "fleet");
    FLEET.forEach((car, i) => {
      const ids = ASSIGN[leg.part][i + 1] || [];
      fleet.append(buildCar(leg, car, leg.dir === "お送り" ? [...ids].reverse() : ids));
    });

    const leftover = el("p", "leftover");
    leftover.hidden = true;

    const legend = el("p", "leg-legend",
      "記号　車＝車椅子（リフト・スロープ使用）／補＝歩行器・車椅子持参もしくは貸出／玄＝玄関先まで送迎　　"
      + "■＝乗車　□＝空席（定員は運転手を除く人数）　　※印＝自動で入った値を手で書き換えた欄　　"
      + "時刻は住所から換算した目安。変更は運行管理者へ連絡のうえ余白に記入してください。");

    section.append(head, fleet, leftover, legend);
    return section;
  }

  /* ── 時刻の自動計算 ────────────────────────
     事業所の出庫時刻から、住所間の移動時間と乗降時間を積み上げる。
     手入力された時刻はそこから先の起点として扱い、上書きしない。 */
  function computeTimes(section, leg) {
    const depart = parseHHMM(leg.depart) || 0;

    section.querySelectorAll(".car").forEach((car) => {
      let cursor = depart;
      let from = DEPOT;

      car.querySelectorAll(".stop:not(.head)").forEach((stop) => {
        const t = stop.querySelector(".t");
        const user = USER_BY_ID.get(stop.querySelector(".who").value);

        if (!user) {
          if (t.dataset.manual !== "true") t.textContent = "";
          return;
        }

        const auto = roundStep(cursor + travelMin(from, user.pt));

        if (t.dataset.manual === "true") {
          const manual = parseHHMM(t.textContent);
          cursor = manual === null ? auto : manual;
        } else {
          t.textContent = hhmm(auto);
          cursor = auto;
        }

        cursor += user.dwell;
        from = user.pt;
      });
    });
  }

  /* ── 乗車人数・空席・定員超過・重複・未割当 ── */
  function recount(section, leg) {
    const seen = new Map();
    let riders = 0;
    let free = 0;

    section.querySelectorAll(".car").forEach((car) => {
      const capacity = Number(car.dataset.capacity);
      let n = 0;

      car.querySelectorAll(".stop:not(.head)").forEach((stop) => {
        const id = stop.querySelector(".who").value;
        stop.classList.toggle("filled", !!id);
        stop.classList.toggle("empty", !id);
        if (id) {
          n++;
          if (!seen.has(id)) seen.set(id, []);
          seen.get(id).push(stop);
        }
      });

      const over = n > capacity;
      car.classList.toggle("is-over", over);
      car.querySelectorAll(".pip").forEach((pip, i) => pip.classList.toggle("on", i < n));
      car.querySelector(".count").textContent =
        "乗車 " + n + " / " + capacity + " 名" + (over ? "　⚠ 定員超過" : "");

      riders += n;
      free += Math.max(0, capacity - n);
    });

    let dup = 0;
    seen.forEach((stops) => {
      const isDup = stops.length > 1;
      if (isDup) dup++;
      stops.forEach((stop) => stop.classList.toggle("dup", isDup));
    });

    const roster = ROSTER[leg.part];
    const missing = roster.filter((id) => !seen.has(id)).map((id) => USER_BY_ID.get(id).name);

    const set = (name, value, alert) => {
      const b = section.querySelector('[data-stat="' + name + '"]');
      b.textContent = value;
      b.closest(".stat").classList.toggle("is-alert", !!alert);
    };
    set("riders", riders, false);
    set("free", free, false);
    set("left", missing.length, missing.length > 0);
    set("dup", dup, dup > 0);

    const leftover = section.querySelector(".leftover");
    leftover.hidden = missing.length === 0;
    leftover.innerHTML = "";
    leftover.append(el("b", null, "未割当 " + missing.length + "名"));
    leftover.append(document.createTextNode(
      missing.length === roster.length ? "　（名簿全員）" : "　" + missing.join("　／　")
    ));
  }

  function refresh() {
    LEGS.forEach((leg) => {
      const section = document.getElementById("leg-" + leg.key);
      computeTimes(section, leg);
      recount(section, leg);
    });
  }

  function switchLeg(key) {
    LEGS.forEach((leg) => {
      const on = leg.key === key;
      document.getElementById("leg-" + leg.key).hidden = !on;
      document.getElementById("tab-" + leg.key).setAttribute("aria-selected", String(on));
      if (on) {
        document.documentElement.style.setProperty("--accent", "var(--" + leg.accent + ")");
        document.documentElement.style.setProperty("--accent-soft", "var(--" + leg.accent + "-soft)");
      }
    });
  }

  function refreshStamps() {
    const date = titleDate(document.getElementById("date").value);
    document.getElementById("title-date").textContent = date;
    LEGS.forEach((leg) => {
      document.querySelector("#leg-" + leg.key + " .print-stamp").textContent =
        "デイサービス あさひ／" + leg.partLabel + " " + leg.dir + "／" + date;
    });
  }

  /* ── 組み立て ─────────────────────────────── */
  const tablist = document.querySelector(".legs");
  const sections = document.getElementById("sections");

  ["am", "pm"].forEach((part) => {
    const group = el("span", "leg-group");
    group.append(el("span", "group-label", part === "am" ? "午前" : "午後"));
    LEGS.filter((leg) => leg.part === part).forEach((leg) => {
      const tab = el("button", null, leg.dir);
      tab.type = "button";
      tab.id = "tab-" + leg.key;
      tab.setAttribute("role", "tab");
      tab.setAttribute("aria-controls", "leg-" + leg.key);
      tab.setAttribute("aria-selected", "false");
      tab.style.setProperty("--tab", "var(--" + leg.accent + ")");
      tab.addEventListener("click", () => switchLeg(leg.key));
      group.append(tab);
    });
    tablist.append(group);
  });

  LEGS.forEach((leg) => sections.append(buildLeg(leg)));

  switchLeg(LEGS[0].key);
  refresh();
  refreshStamps();

  const dateInput = document.getElementById("date");
  dateInput.addEventListener("change", refreshStamps);
  dateInput.addEventListener("click", () => {
    if (typeof dateInput.showPicker === "function") dateInput.showPicker();
  });

  document.getElementById("btn-print").addEventListener("click", () => window.print());

  document.getElementById("btn-recalc").addEventListener("click", () => {
    document.querySelectorAll(".stop:not(.head) .t").forEach((t) => {
      t.dataset.manual = "false";
      t.classList.remove("edited");
    });
    refresh();
  });

  document.getElementById("btn-clear").addEventListener("click", () => {
    if (!window.confirm("全4便の利用者・時刻・住所・記号と、号車・事業所着の記入を消去します。よろしいですか？")) return;
    document.querySelectorAll(".stop:not(.head)").forEach((stop) => {
      stop.querySelector(".who").value = "";
      applyUser(stop, "");
      stop.querySelector(".t").textContent = "";
    });
    document.querySelectorAll(".no-box, .arrive-box").forEach((b) => { b.textContent = ""; });
    refresh();
  });

  document.addEventListener("input", (e) => {
    if (e.target.closest(".stop")) refresh();
  });
  document.addEventListener("click", (e) => { if (e.target.closest(".tag")) refresh(); });

  /* 貼り付けは書式を落として素のテキストに */
  document.addEventListener("paste", (e) => {
    if (!e.target.closest("[contenteditable]")) return;
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData("text").replace(/\s+/g, " ").trim();
    document.execCommand("insertText", false, text);
  });
</script>
