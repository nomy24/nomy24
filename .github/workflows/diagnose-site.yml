name: Diagnose Sagamihara site

on:
  push:
    branches: [claude/sagamihara-info-app-mey3yx]
    paths:
      - 'scripts/diagnose-site.mjs'
      - '.github/workflows/diagnose-site.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/diagnose-site.mjs
